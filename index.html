<title>Refinehaus Clinic Draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Krub:wght@300;400;500;600&display=swap">

<style>
  :root{
    --c-cream:#FAF8F3;
    --c-cream2:#F3EFE7;
    --c-olive:#465447;
    --c-oliveDark:#39463B;
    --c-walnut:#6B5545;
    --c-walnutDark:#553F30;
    --c-walnutDeep:#452F21;
    --c-sage:#A9AEA6;
    --c-taupe:#C8B6A4;
    --c-charcoal:#353631;
    --c-muted:#6F7069;
    --r-lg:20px;
    --r-md:14px;
    --shadow-soft:0 2px 24px rgba(53,54,49,0.06);
  }

  html{ scroll-behavior:smooth; }
  @media (prefers-reduced-motion: reduce){ html{ scroll-behavior:auto; } }

  body{
    background:var(--c-cream);
    color:var(--c-charcoal);
    font-family:'Manrope','IBM Plex Sans Thai',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  h1,h2,h3,.font-display{ font-family:'Cormorant Garamond', Georgia, serif; text-wrap:balance; }
  .font-thai{ font-family:'IBM Plex Sans Thai', 'Manrope', sans-serif; }
  .font-nav{ font-family:'Krub', 'IBM Plex Sans Thai', sans-serif; letter-spacing:.01em; }
  * { -webkit-tap-highlight-color: transparent; }

  ::selection{ background:var(--c-sage); color:var(--c-oliveDark); }

  a:focus-visible, button:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--c-olive);
    outline-offset:3px;
    border-radius:4px;
  }

  /* ---------- layout helpers ---------- */
  .wrap{ max-width:1360px; margin-inline:auto; padding-inline:22px; }
  @media (min-width:768px){ .wrap{ padding-inline:40px; } }
  @media (min-width:1200px){ .wrap{ padding-inline:56px; } }

  .eyebrow{
    font-family:'Manrope',sans-serif;
    font-size:.72rem;
    letter-spacing:.16em;
    text-transform:uppercase;
    font-weight:700;
  }

  /* ---------- reveal-on-scroll ---------- */
  .reveal{ opacity:0; transform:translateY(26px); transition:opacity .85s cubic-bezier(.16,.8,.24,1), transform .85s cubic-bezier(.16,.8,.24,1); }
  .reveal.is-visible{ opacity:1; transform:none; }
  @media (prefers-reduced-motion: reduce){
    .reveal{ transition:none !important; transform:none !important; opacity:1 !important; }
  }

  /* ---------- placeholder imagery ---------- */
  .ph{
    position:relative;
    overflow:hidden;
    border-radius:var(--r-lg);
    background:
      radial-gradient(circle at 18% 14%, rgba(169,174,166,0.40), transparent 55%),
      radial-gradient(circle at 82% 78%, rgba(200,182,164,0.45), transparent 55%),
      linear-gradient(160deg, #F3EFE7 0%, #E8DFD2 55%, #D6C6B4 100%);
    background-color:#E8DFD2;
    border:1px solid rgba(53,54,49,0.09);
  }
  .ph::before{
    content:"";
    position:absolute; inset:0;
    background-image:repeating-linear-gradient(135deg, rgba(53,54,49,0.035) 0 1px, transparent 1px 15px);
    pointer-events:none;
  }
  .ph-tag{
    position:absolute; left:12px; right:12px; bottom:12px;
    display:flex; align-items:center; gap:7px;
    font-size:.66rem; letter-spacing:.03em; text-transform:uppercase; font-weight:600;
    color:#57564C;
    background:rgba(250,248,243,0.9);
    padding:8px 10px;
    border-radius:10px;
    line-height:1.35;
    backdrop-filter:blur(3px);
  }
  .ph-tag svg{ flex:none; opacity:.75; }

  /* ---------- carousels ---------- */
  .snap-row{
    display:flex; gap:16px;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    padding-bottom:4px;
  }
  .snap-row::-webkit-scrollbar{ display:none; }
  .snap-item{ scroll-snap-align:start; }

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    font-size:.92rem; font-weight:600;
    padding:14px 26px;
    border-radius:999px;
    transition:transform .35s cubic-bezier(.16,.8,.24,1), background-color .35s ease, color .35s ease, border-color .35s ease;
    white-space:nowrap;
  }
  .btn-primary{ background:var(--c-olive); color:var(--c-cream); border:1px solid var(--c-olive); }
  .btn-primary:hover{ background:var(--c-oliveDark); border-color:var(--c-oliveDark); transform:translateY(-1px); }
  .btn-header{ background:var(--c-olive); color:var(--c-cream); border:1px solid var(--c-olive); box-shadow:0 3px 14px rgba(57,70,59,0.35); }
  .btn-header:hover{ background:var(--c-oliveDark); border-color:var(--c-oliveDark); transform:translateY(-1px); box-shadow:0 5px 18px rgba(57,70,59,0.4); }
  .btn-outline{ background:transparent; color:var(--c-olive); border:1px solid var(--c-olive); }
  .btn-outline:hover{ background:var(--c-olive); color:var(--c-cream); transform:translateY(-1px); }
  .btn-cream-outline{ background:transparent; color:var(--c-cream); border:1px solid rgba(250,248,243,0.55); }
  .btn-cream-outline:hover{ background:rgba(250,248,243,0.12); border-color:var(--c-cream); }
  .btn-cream{ background:var(--c-cream); color:var(--c-oliveDark); border:1px solid var(--c-cream); }
  .btn-cream:hover{ background:transparent; color:var(--c-cream); }

  /* ---------- arrow hover ---------- */
  .arrow-cta{ display:inline-flex; align-items:center; gap:6px; }
  .arrow-cta svg{ transition:transform .35s cubic-bezier(.16,.8,.24,1); }
  .arrow-cta:hover svg{ transform:translateX(5px); }

  .img-hover{ overflow:hidden; }
  .img-hover .ph{ transition:transform .8s cubic-bezier(.16,.8,.24,1); }
  .img-hover:hover .ph{ transform:scale(1.035); }

  /* ---------- header ---------- */
  .site-header{ background:var(--c-oliveDark); border-bottom:1px solid rgba(250,248,243,0.08); }

  /* ---------- timeline ---------- */
  .timeline-line{ background:linear-gradient(to right, rgba(70,84,71,0.18), rgba(70,84,71,0.35), rgba(70,84,71,0.18)); }
  @media (max-width:767px){
    .timeline-line-v{ background:linear-gradient(to bottom, rgba(70,84,71,0.35), rgba(70,84,71,0.12)); }
  }

  /* ---------- before/after ---------- */
  .ba-split{ position:relative; border-radius:var(--r-lg); overflow:hidden; border:1px solid rgba(53,54,49,0.09); }
  .ba-half{ position:relative; }
  .ba-label{ position:absolute; top:10px; font-size:.62rem; letter-spacing:.12em; font-weight:700; padding:5px 10px; border-radius:999px; background:rgba(250,248,243,0.92); color:var(--c-oliveDark); }

  /* ---------- misc ---------- */
  .divider{ height:1px; background:rgba(53,54,49,0.12); }
  .divider-light{ height:1px; background:rgba(250,248,243,0.14); }
  .mobile-sticky-cta{ background:var(--c-cream2); border-top:1px solid rgba(53,54,49,0.1); }
  .card-lift{ transition:transform .4s cubic-bezier(.16,.8,.24,1), box-shadow .4s ease; }
  .card-lift:hover{ transform:translateY(-4px); box-shadow:var(--shadow-soft); }
  .tap{ transition:transform .25s ease; }
  .tap:active{ transform:scale(.97); }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:rgba(70,84,71,0.25); border-radius:99px; }
</style>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

/* ============================== helpers ============================== */

function useReveal(){
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if(!el) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if(entry.isIntersecting){ el.classList.add('is-visible'); io.unobserve(el); }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -60px 0px' });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return ref;
}

function Reveal({ children, className = "", delay = 0, as = "div" }){
  const ref = useReveal();
  const Tag = as;
  return (
    <Tag ref={ref} className={`reveal ${className}`} style={{ transitionDelay: `${delay}ms` }}>
      {children}
    </Tag>
  );
}

function CameraIcon(props){
  return (
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" {...props}>
      <path d="M4 8h3l2-2.5h6L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/>
      <circle cx="12" cy="13.5" r="3.4"/>
    </svg>
  );
}

function Ph({ label, ratio = "4 / 5", className = "" }){
  return (
    <div className={`ph ${className}`} style={{ aspectRatio: ratio }} role="img" aria-label={label}>
      <span className="ph-tag"><CameraIcon /> {label}</span>
    </div>
  );
}

function ArrowRight(props){
  return (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" {...props}>
      <path d="M5 12h14M13 6l6 6-6 6" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

function CircleArrow(){
  return (
    <span className="arrow-cta w-10 h-10 rounded-full border border-olive/35 flex items-center justify-center text-olive shrink-0 group-hover:bg-olive group-hover:text-cream transition-colors duration-300">
      <ArrowRight width="16" height="16" />
    </span>
  );
}

function Eyebrow({ children, tone = "olive", className = "" }){
  const toneClass = tone === "cream" ? "text-taupe" : "text-walnut";
  return <p className={`eyebrow ${toneClass} ${className}`}>{children}</p>;
}

function SectionHeading({ eyebrow, titleEn, titleTh, align = "left", tone = "dark", subtitle }){
  const isCenter = align === "center";
  const textTone = tone === "cream" ? "text-cream" : "text-charcoal";
  const subTone = tone === "cream" ? "text-cream/75" : "text-muted";
  return (
    <div className={isCenter ? "text-center mx-auto max-w-2xl" : "max-w-xl"}>
      {eyebrow && <Eyebrow tone={tone === "cream" ? "cream" : "olive"} className="mb-4">{eyebrow}</Eyebrow>}
      {titleEn && <h2 className={`font-display font-medium ${textTone} text-[2.1rem] sm:text-[2.5rem] lg:text-[3rem] leading-[1.08] mb-3`}>{titleEn}</h2>}
      {titleTh && <p className={`font-thai ${subTone} text-[1.02rem] sm:text-[1.08rem] leading-relaxed`}>{titleTh}</p>}
      {subtitle && <p className={`font-thai ${subTone} text-[1.02rem] leading-relaxed mt-2`}>{subtitle}</p>}
    </div>
  );
}

  return (
    <header className={`site-header fixed top-0 inset-x-0 z-40 transition-shadow duration-300 ${scrolled ? 'shadow-[0_4px_24px_rgba(0,0,0,0.18)]' : ''}`}>
